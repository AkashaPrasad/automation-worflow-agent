[project]
name = "adjutant"
version = "0.1.0"
description = "Adjutant: a Chief-of-Staff agent with calibrated autonomy (Muse plans, Jev judges, code decides)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "openai>=1.50",
  "typesafe-sdk>=0.7",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "mcp>=2.2",
  "ag-ui-protocol>=0.1",
  "python-dateutil>=2.9",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "notion-client>=2.2",
  "slack-sdk>=3.31",
  "aiohttp>=3.9",
  "cryptography>=42",
  "jsonschema>=4.20",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
laya = ["laya>=0.3.22"]  # optional offline judge fallback (pulls torch, ~2.9 GB RSS)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls external model APIs (skipped when the API key is missing)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
